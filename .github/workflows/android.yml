name: Build XvsO APK
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'game_logic_2_0.py'
      - 'ww_beast.pkl'
      - 'buildozer.spec'
      - 'assets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            build-essential
      - name: Install Buildozer and compatible Python tools
        run: |
          python3 -m pip install --user pip==24.3.1
          python3 -m pip install --user buildozer==1.5.0 cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clean previous Android build state
        run: |
          buildozer android clean
          rm -rf .buildozer/android/platform/build-*
      - name: Build debug APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: buildozer -v android debug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XvsO-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
