name: Build XvsO APK
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'game_logic_2_0.py'
      - 'ww_beast.pkl'
      - 'buildozer.spec'
      - 'assets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf libtool pkg-config zlib1g-dev libncurses5-dev             libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev             build-essential imagemagick
      - name: Prepare launcher icon
        run: |
          mkdir -p assets
          convert -background none assets/icon.svg -resize 512x512 assets/icon.png
      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XvsO-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
